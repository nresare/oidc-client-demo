# Application configuration for oidc-client-demo

[app]
secret-key-path = "/random-secrets/session-key"
base-url = "https://demo.resare.com"
# PEM files from the website-generated TLS Secret; enables the HTTPS listener on 8443.
tls-cert-path = "/tls/tls.crt"
tls-key-path = "/tls/tls.key"

[oidc]
issuer = "https://id.noa.re"
client-id = "oidc-client-demo"
scopes = ["openid", "profile", "email", "offline_access"]
client-secret-path = "/secret/client_id"


[traces]
endpoint = "http://tempo.tempo.svc:4318/v1/traces"
service-name = "oidc-client-demo"

excluded-paths = ["/healthz"]
